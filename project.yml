name: binge
options:
  bundleIdPrefix: com.ordureconnoisseur
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"

targets:
  binge:
    type: application
    platform: iOS
    sources:
      - path: binge
        excludes:
          - "**/*.md"
    info:
      path: binge/Info.plist
      properties:
        # iOS blocks plain http by default; the Stash GraphQL endpoint
        # is typically http://<lan-ip>:9999 on the user's home server,
        # so we need an ATS exception. Acceptable for a personal
        # sideload build; App Store submission would require
        # justification or per-host allowlist.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ordureconnoisseur.binge
        TARGETED_DEVICE_FAMILY: "1"  # iPhone-only for v0.1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Personal sideload via free Apple ID — set DEVELOPMENT_TEAM
        # in your local Xcode preferences after opening the project
        # (Signing & Capabilities → Team → your personal account).
        CODE_SIGN_STYLE: Automatic
