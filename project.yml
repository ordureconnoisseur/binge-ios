name: binge
options:
  bundleIdPrefix: com.ordureconnoisseur
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"

targets:
  binge:
    type: application
    platform: iOS
    sources:
      - path: binge
        excludes:
          - "**/*.md"
    info:
      path: binge/Info.plist
      properties:
        # Home screen + Settings list both read CFBundleDisplayName
        # before falling back to CFBundleName. Setting the display
        # name explicitly so the icon reads "Binge" (capital B)
        # instead of the project's lowercase target name.
        CFBundleDisplayName: Binge
        # iOS blocks plain http by default; the Stash GraphQL endpoint
        # is typically http://<lan-ip>:9999 on the user's home server,
        # so we need an ATS exception. Acceptable for a personal
        # sideload build; App Store submission would require
        # justification or per-host allowlist.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        # bingeios, not binge. Apple refused to re-register
        # com.ordureconnoisseur.binge ("cannot be registered to your
        # development team because it is not available") after every
        # provisioning profile on the build machine disappeared, so the
        # identifier was re-registered under a new name.
        #
        # iOS keys the keychain and UserDefaults off the bundle id, so
        # this installs as a SEPARATE app: the Stash URL, the API key
        # and every setting start empty, and the old binge stays on the
        # home screen until it is deleted by hand.
        PRODUCT_BUNDLE_IDENTIFIER: com.ordureconnoisseur.bingeios
        TARGETED_DEVICE_FAMILY: "1"  # iPhone-only for v0.1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Personal (free) Apple ID team; needed so headless
        # xcodebuild -allowProvisioningUpdates can sign without
        # opening the Xcode GUI to pick a team.
        DEVELOPMENT_TEAM: PRM329646X
        CODE_SIGN_STYLE: Automatic
